<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Howard Wang – Class Presentations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #000; --muted: #555; --rule: #ccc; --paper: #fff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font-family: Carlito, Calibri, Arial, sans-serif; line-height: 1.4; }
  main { max-width: 860px; margin: 0 auto; padding: 72px 24px 96px; }
  h1 { font-size: 44px; line-height: 1.1; margin: 0 0 8px; }
  .by { font-size: 20px; color: var(--muted); margin: 0 0 28px; }
  hr { border: 0; border-top: 2px solid var(--rule); margin: 0 0 8px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { border-bottom: 1px solid var(--rule); }
  a.item { display: block; padding: 24px 0; color: inherit; text-decoration: none; }
  a.item:hover .title, a.item:focus-visible .title { text-decoration: underline; }
  .course { font-size: 16px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .title { font-size: 26px; font-weight: 700; margin: 4px 0; }
  .meta { font-size: 17px; color: var(--muted); }
  .hint { margin-top: 32px; font-size: 16px; color: var(--muted); }
  @media (max-width: 520px) { main { padding: 40px 16px 64px; } h1 { font-size: 34px; } .title { font-size: 22px; } }
</style>
</head>
<body>
<main>
  <h1>Class Presentations</h1>
  <p class="by">Howard Wang</p>
  <hr>
  <ul>
    <li>
      <a class="item" href="ece523-paper3/">
        <div class="course">ECE 523 · Fall 2026 · Paper 3</div>
        <div class="title">A Photo-Crosslinkable Fluoropolymer-Passivated Flexible Neural Probe</div>
        <div class="meta">Kim, Koo, Kim &amp; Jung, Biomaterials Advances 154 (2023) 213629 · 23 slides</div>
      </a>
    </li>
  </ul>
  <p class="hint">In a deck: arrow keys or click to move, N for speaker notes, F for fullscreen.</p>
</main>
</body>
</html>
